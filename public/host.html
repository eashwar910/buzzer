<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Buzzer – Host</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="hosting">
<div class="conn" role="status">Reconnecting…</div>
<main>
  <div class="row spread" style="margin-bottom:14px">
    <div class="brand">Buzz<span>er</span> <span class="muted" style="font-size:16px;font-weight:600">host</span></div>
    <button class="danger" id="end">End game</button>
  </div>
  <p class="err" id="err" role="alert"></p>

  <div class="host">
    <div>
      <div class="card join">
        <h3>Scan to join</h3>
        <img id="qr" class="qr" alt="QR code to join this room (tap to enlarge)" hidden>
        <div style="min-width:0">
          <div class="code" id="code">·····</div>
          <a id="link" target="_blank"></a>
        </div>
      </div>
    </div>

    <div>
      <div class="card controls">
        <button class="primary" id="open">Open buzzers</button>
        <button id="lock">Lock</button>
        <button id="reset">Clear</button>
      </div>
      <div class="card"><h3>Buzz order</h3><ol class="list" id="order"></ol></div>
      <div class="card">
        <div class="row spread" style="margin-bottom:4px">
          <h3 style="margin:0">Players <span id="count"></span></h3>
          <label class="step">Points per tap <input id="step" type="number" value="1" min="1" inputmode="numeric"></label>
        </div>
        <table id="players"></table>
      </div>
    </div>
  </div>
</main>
<script src="/client.js"></script>
<script>
  let code = new URLSearchParams(location.search).get('room')?.toUpperCase();
  const tokenKey = () => 'buzzer.host.' + code;
  const host = api => api.send({ t: 'host', code, hostToken: localStorage.getItem(tokenKey()) });

  const api = connect(api => code ? host(api) : api.send({ t: 'create' }), (m, api) => {
    if (m.t === 'created') {
      code = m.code;
      localStorage.setItem(tokenKey(), m.hostToken);
      history.replaceState(null, '', '?room=' + code);
      host(api);
    } else if (m.t === 'state') render(m);
    else if (m.t === 'ended') {
      localStorage.removeItem(tokenKey()); localStorage.removeItem('buzzer.last');
      location.replace('/');
    } else if (m.t === 'error') $('err').textContent = m.msg;
  });

  $('qr').onclick = () => $('qr').classList.toggle('big');
  $('open').onclick =() => api.send({ t: 'open' });
  $('lock').onclick = () => api.send({ t: 'lock' });
  // "Clear" = reopen then lock: wipes the buzz list without leaving buzzers live.
  $('reset').onclick = () => { api.send({ t: 'open' }); api.send({ t: 'lock' }); };
  $('end').onclick = () => confirm('End the game for everyone?') && api.send({ t: 'end' });
  $('players').onclick = e => {
    const b = e.target.closest('button[data-id]');
    if (b) api.send({ t: 'score', playerId: b.dataset.id, delta: Number(b.dataset.sign) * (Number($('step').value) || 1) });
  };

  function render(s) {
    localStorage.setItem('buzzer.last', location.href);
    $('err').textContent = '';
    const url = `${location.origin}/play.html?room=${s.code}`;
    $('code').textContent = s.code;
    $('link').textContent = $('link').href = url;
    if ($('qr').hidden) { $('qr').src = '/qr?text=' + encodeURIComponent(url); $('qr').hidden = false; }
    $('open').textContent = s.open ? 'Reset & reopen' : 'Open buzzers';
    $('lock').disabled = !s.open;
    $('reset').disabled = !s.buzzes.length;
    $('order').innerHTML = renderBuzzes(s);
    $('count').textContent = s.players.length ? `· ${s.players.length}` : '';
    $('players').innerHTML = s.players.length ? s.players.map(p => `<tr>
      <td class="nm"><span class="dot ${p.online ? 'on' : ''}"></span> ${esc(p.name)}</td>
      <td class="n">${p.score}</td>
      <td class="a"><button data-id="${p.id}" data-sign="-1" aria-label="Remove points from ${esc(p.name)}">−</button>
        <button data-id="${p.id}" data-sign="1" aria-label="Add points to ${esc(p.name)}">+</button></td></tr>`).join('')
      : '<tr><td class="muted">No players yet. Scan the QR code to join.</td></tr>';
  }
</script>
</body>
</html>
